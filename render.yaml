services:
  - type: web
    name: doohgle-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: doohgle
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AWS_ACCESS_KEY_ID
        sync: false  # Set manually in dashboard
      - key: AWS_SECRET_ACCESS_KEY
        sync: false  # Set manually in dashboard
      - key: AWS_REGION
        value: us-east-1  # Change to your preferred region
      - key: S3_BUCKET_NAME
        sync: false  # Set manually in dashboard
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false  # Set manually in dashboard
      - key: SMTP_PASS
        sync: false  # Set manually in dashboard
      - key: EMAIL_USER
        sync: false  # Set manually in dashboard
      - key: EMAIL_TLS_INSECURE
        value: false
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

databases:
  - name: doohgle
    databaseName: doohgle
    user: doohgle_user
    region: oregon
    plan: starter
